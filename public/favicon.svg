<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="foodcart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF8A65"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="64" height="64" rx="16" fill="url(#foodcart-grad)" />

  <!-- Food Cloche Top Handle -->
  <circle cx="32" cy="17" r="2.5" fill="#FFFFFF" />

  <!-- Cloche / Cart Dome Cover -->
  <path d="M 18 30 A 14 14 0 0 1 46 30 Z" fill="#FFFFFF" />

  <!-- Cart / Plate Base Tray -->
  <rect x="15" y="32" width="34" height="4" rx="2" fill="#FFFFFF" />

  <!-- Cart Basket Lines -->
  <path d="M 21 36 L 24 45 H 40 L 43 36" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Cart Wheels -->
  <circle cx="25" cy="50" r="3" fill="#FFFFFF" />
  <circle cx="39" cy="50" r="3" fill="#FFFFFF" />
</svg>
